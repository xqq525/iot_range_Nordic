CONFIG_NCS_SAMPLES_DEFAULTS=y

# NFC
CONFIG_NFC_T4T_NRFXLIB=y

CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_REC=y
CONFIG_NFC_NDEF_URI_MSG=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# DK buttons and LEDs — 禁用（PCB-A 无 DK 外设，引脚已分配给业务功能）
CONFIG_DK_LIBRARY=n

CONFIG_SERIAL=y

CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Shell CLI — RTT 后端（不占 UART 引脚）
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_STACK_SIZE=2048

CONFIG_HEAP_MEM_POOL_SIZE=2048

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ULP_RS100"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# BT buffer pool — OTA 每包 492 字节，ATT payload 495，MTU 498
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_TX_COUNT=6
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=4
CONFIG_BT_BUF_EVT_RX_COUNT=12

# NUS service
CONFIG_BT_NUS=y

# Bonding
CONFIG_BT_SETTINGS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logger — RTT 模式（J-Link 输出），显式反制 NCS_SAMPLES_DEFAULTS 的 LOG_MODE_MINIMAL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

# RTT Shell 和 RTT Log 用不同 buffer，避免冲突
CONFIG_LOG_BACKEND_RTT_BUFFER=0
CONFIG_SHELL_BACKEND_RTT_BUFFER=1

CONFIG_ASSERT=y
